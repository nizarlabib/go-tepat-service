name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memolab
          POSTGRES_PASSWORD: memolab
          POSTGRES_DB: memolab
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U memolab -d memolab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: go mod download

      - name: Run gofmt
        run: gofmt -l . || (echo "gofmt issues found:" && gofmt -d . && exit 1)

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./... -count=1
        env:
          POSTGRES_CONNECTION: postgres://memolab:memolab@localhost:5432/memolab?sslmode=disable
          REDIS_CONNECTION: redis://localhost:6379/0
          JWT_KEY: test-jwt-key-for-ci-only
          AES_KEY: test-aes-key-for-ci-only
          HTTP_PORT: 8080
          APP_ENV: ci
          APP_VERSION: 1.0.0

      - name: Run tests with race detector
        run: go test -race ./internal/spesial/... ./internal/infrastructure/... ./internal/value_object/v1/pagination/... ./internal/pkg/middleware/... -count=1
        env:
          JWT_KEY: test-jwt-key-for-ci-only
          AES_KEY: test-aes-key-for-ci-only

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t go-memolab-service:latest .
